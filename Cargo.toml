[package]
name = "openpages"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Self-hosted Cloudflare Pages: link a repo, push, it's live."
license = "MIT"
repository = "https://github.com/one-more-refactor/openpages"

[[bin]]
name = "openpages"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros", "http2"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
hyper = "1"

sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio", "sqlite", "chrono", "macros", "migrate", "json",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
async-stream = "0.3"

rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
semver = "1"
regex = "1"
walkdir = "2"
socket2 = "0.5"
libc = "0.2"
tempfile = "3"
urlencoding = "2"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
